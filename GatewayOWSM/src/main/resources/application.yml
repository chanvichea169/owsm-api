server:
  port: 9001

spring:
  application:
    name: GatewayOWSM

  cloud:
    gateway:
      routes:
        - id: AuthService
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**,/api/roles/**,/api/profile/**,/api/auth/**,/api/permissions/**,/uploads/profiles/**

        - id: NewsService
          uri: http://localhost:8082
          predicates:
            - Path=/api/news/**,/api/categories/**,/api/comments/**,/api/tags/**,/api/authors/**,/api/media-assets/**,/uploads/news/**

      default-filters:
        - DedupedResponseHeader=Access-Control-Allow-Origin RETAIN_UNIQUE
