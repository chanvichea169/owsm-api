spring:
  application:
    name: NewsService

  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  datasource:
    url: jdbc:postgresql://localhost:5432/news_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8082

app:
  file:
    upload-dir: ../uploads
    news-dir: ../uploads/news
    gallery-dir: ../uploads/news/gallary_images

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    alert-chat-id: ${TELEGRAM_ALERT_CHAT_ID:}
