server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: attendanceService

  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/attendance_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  file:
    upload-dir: uploads

auth:
  service:
    uri: ${AUTH_SERVICE_URI:http://localhost:8081}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    alert-chat-id: ${TELEGRAM_ALERT_CHAT_ID:}